name: Build Android APK (AI Selection + Unlocked)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '编译目标架构 (aarch64 适合绝大多数新手机且速度快；universal 包含全架构)'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - universal
      create_release:
        description: '是否同时发布到 GitHub Releases 页面供直接下载'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*-ai*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: 1. 检出源码与子模块 (Checkout)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装 Node.js 24 与 pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 全局安装 pnpm
        run: npm install -g pnpm

      - name: 3. 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 默认会安装 legacy `tools` 包，该包已从 SDK 仓库下架，会让 sdkmanager 直接失败
          packages: 'platform-tools'

      - name: 5. 安装 Android NDK 28 / build-tools / platform 与 Rust 交叉编译目标
        run: sdkmanager "ndk;28.2.13676358" "build-tools;34.0.0" "platforms;android-34"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 6. 安装 pnpm 依赖并准备 PDF.js 资源
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors

      - name: 7. 重建 Android gradle 骨架 (仓库只提交了定制文件，需先 init 再恢复定制)
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

      - name: 8. 执行 AI 划词组件注入与官方 AI 功能解锁脚本
        run: |
          if [ -f apply-ai-feature.mjs ]; then
            node apply-ai-feature.mjs
          fi

      - name: 9. 准备 Next.js 环境变量
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/readest-app/.env.local

      - name: 10. 配置/复用签名密钥 (写入 gradle keystore.properties)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'readest123' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'readest_ai' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'readest123' }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/readest-release.keystore"
          mkdir -p "$RUNNER_TEMP/signed_output"
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "复用已配置的持久化签名 Secret"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          else
            echo "未配置持久化 Secret，自动生成本次构建签名证书"
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=ReadestAI, OU=Dev, O=ReadestMod, L=Local, S=Local, C=CN"
            base64 -w 0 "$KEYSTORE_PATH" > "$RUNNER_TEMP/signed_output/keystore_base64.txt"
            cp "$KEYSTORE_PATH" "$RUNNER_TEMP/signed_output/readest-signing.keystore"
            echo "==================== 持久化签名配置指引 ===================="
            echo "把 keystore_base64.txt 的内容存到仓库 Secret ANDROID_KEYSTORE_BASE64，"
            echo "以后每次打包都能直接覆盖安装（不提示签名冲突）。"
            echo "============================================================"
          fi
          cd apps/readest-app/src-tauri/gen/android
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' "$KEY_ALIAS" "$KEYSTORE_PASSWORD" "$KEYSTORE_PATH" > keystore.properties

      - name: 11. 编译 Tauri Android APK (gradle 内直接完成 V2/V3 签名)
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.arch }}" = "universal" ]; then
            npx dotenv -e .env.tauri -- pnpm tauri android build --apk
          else
            npx dotenv -e .env.tauri -- pnpm tauri android build --apk -t aarch64
          fi
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" ! -name "*unsigned*" | head -n 1)
          echo "编译产物: $APK"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/signed_output/Readest-AI-Unlocked-arm64.apk"
          ls -lh "$RUNNER_TEMP/signed_output/"

      - name: 12. 上传 APK 与签名证书到 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Readest-AI-Unlocked-Android-APK
          path: ${{ runner.temp }}/signed_output/*
          if-no-files-found: error

      - name: 13. 自动发布到 GitHub Releases
        if: ${{ github.event.inputs.create_release != 'false' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.12.20-ai.${{ github.run_number }}
          name: "Readest AI 增强解锁版 (Build #${{ github.run_number }})"
          body: |
            ### 本次自动编译包含以下改造
            1. **Anx Reader 风格划词「问 AI」面板**：选中书中文字后可直接点快捷胶囊（深度解析、提炼要点、语境精译、背景考据、批判思考）并多轮追问，支持一键存入批注。
            2. **官方内置 AI 功能全解锁**：解除 `Custom Translators`（自定义 OpenAI/DeepSeek/Gemini 翻译器）与 `Context Dictionary`（AI 语境词典）的付费限制。
            3. **已自动完成 APK 签名**：直接下载下方 `Readest-AI-Unlocked-arm64.apk` 即可在 Android 手机/平板/电纸书安装。

            > 若要以后每次更新都能直接覆盖安装（不报签名冲突），把附件 `keystore_base64.txt` 的内容存进仓库 Secret `ANDROID_KEYSTORE_BASE64`。
          files: |
            ${{ runner.temp }}/signed_output/Readest-AI-Unlocked-arm64.apk
            ${{ runner.temp }}/signed_output/readest-signing.keystore
            ${{ runner.temp }}/signed_output/keystore_base64.txt
